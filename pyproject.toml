[project]
name = "agi-memory"
version = "0.2.0"
description = "Turnkey zero-dependency four-pillar cognitive memory framework (Epistemic, Semantic, Episodic, Structural Code Graph) with MCP server for Claude Code, Cursor, Codex, OpenCode, Antigravity, and more"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Krunal Bhalala" }]
keywords = ["mcp", "agi-memory", "ai-memory", "knowledge-graph", "claude-code", "cursor", "codex", "opencode", "llm", "sqlite"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
agi-memory = "agi_memory.mcp_server:main"
agent-memory = "agi_memory.mcp_server:main"
agi-integrate = "agi_memory.integrate:main"
agent-integrate = "agi_memory.integrate:main"
agi-bootstrap = "agi_memory.bootstrap:main"
agent-bootstrap = "agi_memory.bootstrap:main"
agi-hooks = "agi_memory.hooks:main"
agent-hooks = "agi_memory.hooks:main"
agi-recall = "agi_memory.recall:main"
agent-recall = "agi_memory.recall:main"
agi-sync = "agi_memory.sync:main"
agent-sync = "agi_memory.sync:main"

[project.urls]
Homepage = "https://github.com/kdbhalala/agi-memory"
Repository = "https://github.com/kdbhalala/agi-memory"
Issues = "https://github.com/kdbhalala/agi-memory/issues"

