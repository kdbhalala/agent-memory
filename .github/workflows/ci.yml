name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install agi-memory
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Report SQLite FTS5 tokenizer support
        run: |
          python tests/check_sqlite_features.py

      - name: Run offline test suite
        run: |
          python tests/test_offline.py

      - name: Run evaluations
        run: |
          python tests/eval_l1.py
          python tests/eval_l2.py
          python tests/eval_l3.py
          python tests/eval_l4.py

      - name: Run adversarial robustness suite
        run: |
          python tests/chaos_test.py

      - name: Test MCP server stdio protocol
        run: |
          python -m agi_memory.integrate test

      - name: Check integrate status
        run: |
          python -m agi_memory.integrate status

